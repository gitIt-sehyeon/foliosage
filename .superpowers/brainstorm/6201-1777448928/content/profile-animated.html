<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060b14; color: #fff; font-family: -apple-system, sans-serif; }

  /* Aurora bg */
  @keyframes aurora {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Shimmer text */
  @keyframes shimmer {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  /* Float particles */
  @keyframes float {
    0%, 100% { transform: translateY(0px); opacity: 0.5; }
    50%       { transform: translateY(-10px); opacity: 1; }
  }

  /* Slide up */
  @keyframes slide-up {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  /* Glow pulse */
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 16px rgba(109,40,217,0.3); }
    50%       { box-shadow: 0 0 28px rgba(109,40,217,0.7), 0 0 48px rgba(109,40,217,0.3); }
  }

  /* Card hover */
  .portfolio-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.3s ease,
                box-shadow 0.3s ease;
    animation: slide-up 0.5s ease both;
  }
  .portfolio-card:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: #6d28d9;
    box-shadow: 0 8px 32px rgba(109,40,217,0.3);
  }
  .portfolio-card:nth-child(2) { animation-delay: 0.15s; }

  .stat-box { animation: slide-up 0.5s ease both; }
  .stat-box:nth-child(2) { animation-delay: 0.1s; }
  .stat-box:nth-child(3) { animation-delay: 0.2s; }

  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Nav -->
<div style="background:#0a0f1e;border-bottom:1px solid #1e293b;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;">
  <div style="color:#a78bfa;font-size:13px;font-weight:800;letter-spacing:1px;">FolioSage</div>
  <div style="background:#1e293b;border:1px solid #334155;color:#64748b;font-size:9px;padding:5px 12px;border-radius:8px;">로그인 / 가입</div>
</div>

<!-- Hero header - Aurora bg + particles -->
<div style="position:relative;overflow:hidden;padding:36px 32px 28px;">
  <!-- Aurora background -->
  <div style="position:absolute;inset:0;background:linear-gradient(135deg,#1e0a3c,#0f172a,#0d2137,#150d2e,#1e0a3c);background-size:400% 400%;animation:aurora 8s ease infinite;"></div>

  <!-- Particles -->
  <div class="particle" style="width:5px;height:5px;background:#6d28d9;top:20px;left:15%;animation:float 3.5s ease-in-out infinite;"></div>
  <div class="particle" style="width:3px;height:3px;background:#4f46e5;top:50px;right:20%;animation:float 4.2s ease-in-out infinite 0.8s;"></div>
  <div class="particle" style="width:4px;height:4px;background:#a78bfa;bottom:20px;left:40%;animation:float 3s ease-in-out infinite 0.3s;opacity:0.6;"></div>
  <div class="particle" style="width:3px;height:3px;background:#818cf8;top:30px;right:35%;animation:float 5s ease-in-out infinite 1.2s;"></div>
  <div class="particle" style="width:6px;height:6px;background:#6d28d9;bottom:15px;right:10%;animation:float 3.8s ease-in-out infinite 0.5s;opacity:0.4;"></div>

  <!-- Content -->
  <div style="position:relative;z-index:1;display:flex;align-items:flex-start;gap:18px;max-width:760px;margin:0 auto;">
    <!-- Avatar with glow -->
    <div style="width:64px;height:64px;background:linear-gradient(135deg,#6d28d9,#4f46e5);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;animation:glow 2.5s ease-in-out infinite;">👤</div>

    <div style="flex:1;">
      <!-- Shimmer name -->
      <div style="font-size:22px;font-weight:800;background:linear-gradient(90deg,#a78bfa 0%,#ffffff 40%,#6d28d9 60%,#a78bfa 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite;">김민준</div>
      <div style="color:#a78bfa;font-size:11px;margin-top:3px;">UI/UX Designer · 서울</div>
      <div style="color:#64748b;font-size:10px;margin-top:8px;line-height:1.7;max-width:400px;">사용자 경험을 중심으로 생각하는 신입 디자이너입니다. Figma, React 기반 프로토타이핑 가능합니다.</div>
      <div style="display:flex;gap:6px;margin-top:10px;">
        <div style="background:rgba(30,41,59,0.8);border:1px solid #334155;color:#94a3b8;font-size:9px;padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px);">🔗 링크드인</div>
        <div style="background:rgba(30,41,59,0.8);border:1px solid #334155;color:#94a3b8;font-size:9px;padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px);">🐙 깃허브</div>
      </div>
    </div>

    <!-- Stats -->
    <div style="display:flex;gap:10px;flex-shrink:0;">
      <div class="stat-box" style="background:rgba(30,41,59,0.6);border:1px solid #334155;border-radius:12px;padding:10px 14px;text-align:center;backdrop-filter:blur(8px);">
        <div style="color:#a78bfa;font-size:20px;font-weight:800;">2</div>
        <div style="color:#475569;font-size:8px;">포트폴리오</div>
      </div>
      <div class="stat-box" style="background:rgba(30,41,59,0.6);border:1px solid #334155;border-radius:12px;padding:10px 14px;text-align:center;backdrop-filter:blur(8px);">
        <div style="color:#34d399;font-size:20px;font-weight:800;">156</div>
        <div style="color:#475569;font-size:8px;">총 조회</div>
      </div>
    </div>
  </div>
</div>

<!-- Portfolio section -->
<div style="max-width:760px;margin:0 auto;padding:24px 32px;">
  <div style="color:#64748b;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;">공개 포트폴리오</div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">

    <!-- Card 1 -->
    <div class="portfolio-card">
      <!-- Preview -->
      <div style="background:linear-gradient(135deg,#1e0a3c,#0f172a);height:100px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">
        <div style="position:absolute;inset:0;background:linear-gradient(135deg,#2d0a5c,#0f172a,#1e0a3c);background-size:300% 300%;animation:aurora 6s ease infinite;opacity:0.6;"></div>
        <div style="position:relative;z-index:1;display:flex;gap:8px;align-items:flex-end;">
          <div style="background:rgba(255,255,255,0.12);border-radius:6px;width:36px;height:48px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform 0.3s;">📄</div>
          <div style="background:rgba(255,255,255,0.07);border-radius:6px;width:36px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;">📄</div>
          <div style="background:rgba(255,255,255,0.05);border-radius:6px;width:36px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;">🖼️</div>
        </div>
        <div style="position:absolute;bottom:8px;right:10px;background:rgba(109,40,217,0.85);color:#fff;font-size:8px;padding:2px 8px;border-radius:20px;backdrop-filter:blur(4px);">3개 파일</div>
      </div>
      <div style="padding:14px 16px;">
        <div style="color:#fff;font-size:12px;font-weight:700;">신입 UI/UX 디자이너 포트폴리오</div>
        <div style="color:#64748b;font-size:9px;margin-top:4px;">이력서, 작업물, 디자인 시스템 포함</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
          <div style="display:flex;gap:4px;">
            <div style="background:rgba(109,40,217,0.15);color:#a78bfa;font-size:8px;padding:2px 8px;border-radius:20px;">UI/UX</div>
            <div style="background:rgba(79,70,229,0.15);color:#818cf8;font-size:8px;padding:2px 8px;border-radius:20px;">Figma</div>
          </div>
          <div style="color:#475569;font-size:9px;">👁 42</div>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="portfolio-card">
      <div style="background:linear-gradient(135deg,#0d2137,#0f172a);height:100px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">
        <div style="position:absolute;inset:0;background:linear-gradient(135deg,#0d2137,#0a1929,#0d2137);background-size:300% 300%;animation:aurora 7s ease infinite 1s;opacity:0.7;"></div>
        <div style="position:relative;z-index:1;display:flex;gap:8px;align-items:flex-end;">
          <div style="background:rgba(255,255,255,0.12);border-radius:6px;width:36px;height:48px;display:flex;align-items:center;justify-content:center;font-size:18px;">📁</div>
          <div style="background:rgba(255,255,255,0.07);border-radius:6px;width:36px;height:42px;display:flex;align-items:center;justify-content:center;font-size:18px;">🖼️</div>
        </div>
        <div style="position:absolute;bottom:8px;right:10px;background:rgba(6,78,59,0.85);color:#34d399;font-size:8px;padding:2px 8px;border-radius:20px;">2개 파일</div>
      </div>
      <div style="padding:14px 16px;">
        <div style="color:#fff;font-size:12px;font-weight:700;">앱 리디자인 케이스스터디</div>
        <div style="color:#64748b;font-size:9px;margin-top:4px;">카카오뱅크 UX 개선 프로젝트</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
          <div style="display:flex;gap:4px;">
            <div style="background:rgba(6,78,59,0.2);color:#34d399;font-size:8px;padding:2px 8px;border-radius:20px;">케이스스터디</div>
          </div>
          <div style="color:#475569;font-size:9px;">👁 114</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer CTA -->
  <div style="text-align:center;margin-top:28px;padding-top:20px;border-top:1px solid #1e293b;">
    <div style="color:#334155;font-size:10px;">
      <span style="background:linear-gradient(90deg,#a78bfa,#6d28d9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;">FolioSage</span>
      <span style="margin-left:4px;">로 나만의 포트폴리오 만들기 →</span>
    </div>
  </div>
</div>

</body>
</html>
