<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FolioSage — 포트폴리오에게 물어보세요</title>
  <link rel="stylesheet" href="styles/foliosage.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:#060912; color:#fff;
      font-family: var(--fs-font-sans); -webkit-font-smoothing: antialiased; }

    /* Custom keyframes used by landing components */
    @keyframes fs-caret-blink { 0%, 49% { opacity:1; } 50%, 100% { opacity:0; } }
    @keyframes fs-logo-spark {
      0%, 100% { transform: scale(1) translateY(0); opacity: 1; }
      50%      { transform: scale(1.18) translateY(-1px); opacity: 0.8; }
    }
    @keyframes fs-glow-pulse {
      0%, 100% { box-shadow: 0 0 24px rgba(124,58,237,0.30); }
      50%      { box-shadow: 0 0 40px rgba(124,58,237,0.75), 0 0 60px rgba(124,58,237,0.20); }
    }
    @keyframes fs-shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }

    /* Smooth scroll for inline anchor jumps */
    html { scroll-behavior: smooth; }

    /* Hide horizontal scroll regardless of children */
    body { overflow-x: hidden; }

    /* Selection */
    ::selection { background: rgba(167,139,250,0.4); color: #fff; }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/icons.jsx"></script>
  <script type="text/babel" src="app/primitives.jsx"></script>
  <script type="text/babel" src="app/mockups-1.jsx"></script>
  <script type="text/babel" src="app/mockups-2.jsx"></script>
  <script type="text/babel" src="app/zooms.jsx"></script>
  <script type="text/babel" src="app/sections-1.jsx"></script>
  <script type="text/babel" src="app/sections-2.jsx"></script>
  <script type="text/babel" src="app/moments.jsx"></script>
  <script type="text/babel" src="app/main.jsx"></script>
  <style id="__om-edit-overrides"></style>
</body>
</html>
