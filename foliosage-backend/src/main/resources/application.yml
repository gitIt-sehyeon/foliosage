spring:
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foliosage}
    username: ${DB_USERNAME:foliosage}
    password: ${DB_PASSWORD:foliosage}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:test-secret-key-minimum-256-bit-length-padding-ok}
  expiration-ms: 86400000

vaultsage:
  api-key: ${VAULTSAGE_API_KEY:test-key}
  base-url: ${VAULTSAGE_BASE_URL:https://api.vaultsage.ai}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
